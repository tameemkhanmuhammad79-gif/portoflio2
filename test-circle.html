<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background: #120F0C;
      color: #F6F1E6;
      font-family: Helvetica, Arial, sans-serif;
      padding: 40px;
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .circle-wrap {
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #E8A204;
      box-shadow: 0 0 0 8px rgba(26, 22, 18, 0.8);
    }
    .w300 { width: 300px; height: 300px; }
    .w200 { width: 200px; height: 200px; }
  </style>
</head>
<body>
  <div class="card">
    <div>1. Unscaled 1024x1024 into 300x300 circle</div>
    <div class="circle-wrap w300">
      <img src="profile.jpg" style="width: 100%; height: 100%; object-fit: cover;">
    </div>
  </div>

  <div class="card">
    <div>2. Scaled 1.18, origin center 32%</div>
    <div class="circle-wrap w300">
      <img src="profile.jpg" style="width: 100%; height: 100%; object-fit: cover; transform: scale(1.18); transform-origin: 50% 32%;">
    </div>
  </div>

  <div class="card">
    <div>3. Scaled 1.25, origin center 30%</div>
    <div class="circle-wrap w300">
      <img src="profile.jpg" style="width: 100%; height: 100%; object-fit: cover; transform: scale(1.25); transform-origin: 50% 30%;">
    </div>
  </div>

  <div class="card">
    <div>4. Scaled 1.12, origin center 35%</div>
    <div class="circle-wrap w300">
      <img src="profile.jpg" style="width: 100%; height: 100%; object-fit: cover; transform: scale(1.12); transform-origin: 50% 35%;">
    </div>
  </div>

  <div class="card">
    <div>5. Mobile 200px unscaled</div>
    <div class="circle-wrap w200">
      <img src="profile.jpg" style="width: 100%; height: 100%; object-fit: cover;">
    </div>
  </div>

  <div class="card">
    <div>6. Mobile 200px scaled 1.18</div>
    <div class="circle-wrap w200">
      <img src="profile.jpg" style="width: 100%; height: 100%; object-fit: cover; transform: scale(1.18); transform-origin: 50% 32%;">
    </div>
  </div>
</body>
</html>
